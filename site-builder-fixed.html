\<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>christians site builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@400;700&family=Merriweather:wght@400;700&family=Poppins:wght@400;700&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080d;--panel:#11111a;--panel2:#171722;--text:#f7f7fb;--muted:#9999aa;--border:#29293a;--accent:#8b6cff;--cyan:#24e5c9;--danger:#ff6d83;--leftw:260px;--rightw:310px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}
.top{height:62px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;background:#09090ef2;backdrop-filter:blur(12px);z-index:30}.brand{font-weight:900}.brand b{color:var(--cyan)}
.actions{display:flex;gap:7px}.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:9px;font-size:12px;font-weight:750;cursor:pointer}.btn:hover{border-color:#56566e}.primary{background:var(--accent);border-color:var(--accent)}.danger{color:var(--danger)}
.layout{display:grid;grid-template-columns:var(--leftw) minmax(0,1fr) var(--rightw);min-height:calc(100vh - 62px)}aside{padding:14px;background:#0d0d15;position:relative;overflow-y:auto;max-height:calc(100vh - 62px)}.left{border-right:1px solid var(--border)}.right{border-left:1px solid var(--border)}
.panel-toggle{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:12px}.panel-toggle .btn{padding:6px 9px;white-space:nowrap}
.panel-body{min-width:220px}
.panel-collapsed{padding:14px 6px !important}
.panel-collapsed .panel-body{display:none}
.panel-collapsed .panel-toggle{justify-content:center}
.panel-collapsed .panel-toggle .label{display:none}
.panel-collapsed .resizer{display:none}
.resizer{position:absolute;top:0;bottom:0;width:6px;cursor:col-resize;z-index:25;background:transparent}
.resizer:hover,.resizer.active{background:var(--accent)}
.left .resizer{right:0}.right .resizer{left:0}
.section{margin-bottom:18px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#707082;font-weight:850;margin-bottom:8px}.pages{display:grid;gap:5px}.page{padding:9px;border-radius:8px;color:var(--muted);display:flex;justify-content:space-between;cursor:pointer}.page.active{background:#211c38;color:white}.page:hover{background:#191925;color:white}.page .x{opacity:.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.field{margin:0 0 10px}.field label{display:block;color:#878798;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#0a0a10;border:1px solid var(--border);color:white;border-radius:8px;padding:8px;outline:none}.field textarea{min-height:70px;resize:vertical}
.workspace{min-width:0;background:#090910;display:flex;flex-direction:column;height:calc(100vh - 62px)}.bar{height:46px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:var(--muted);font-size:11px;gap:10px;flex:none}.bar strong{color:white}
.viewport{flex:1;overflow:auto;padding:60px;display:flex;justify-content:center;align-items:flex-start;background-image:radial-gradient(#20202b 1px,transparent 1px);background-size:18px 18px;position:relative}
.device-toggle{display:flex;gap:4px;align-items:center}.device-btn{padding:6px 10px;font-size:11px}.device-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.canvas.phone-frame{border-radius:34px;outline:8px solid #000;outline-offset:0}
.zoom-controls{display:flex;align-items:center;gap:6px;flex:none}.zoom-controls .btn{padding:6px 10px}#zoomLabel{min-width:42px;text-align:center;font-size:11px;color:var(--muted)}
.canvas-wrap{position:relative;flex:none;transition:transform 0.15s ease-out;transform-origin:top center}
.canvas{position:relative;flex:none;overflow:hidden;box-shadow:0 25px 80px #0008}.element{position:absolute;border:1px dashed transparent;user-select:none;cursor:move}.element.selected{border-color:var(--accent);box-shadow:0 0 0 2px #8b6cff33}.handle{display:none;position:absolute;right:-5px;bottom:-5px;width:10px;height:10px;border-radius:3px;background:var(--accent);cursor:nwse-resize}.selected .handle{display:block}

/* Premade Selective Custom UI Elements */
.ui-preset-none{}
.ui-preset-card{background:rgba(255,255,255,0.04)!important;border:1px solid rgba(255,255,255,0.12)!important;backdrop-filter:blur(10px);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.ui-preset-glass{background:rgba(255,255,255,0.08)!important;backdrop-filter:blur(16px)!important;-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.2)!important;border-radius:16px;box-shadow:0 8px 32px 0 rgba(0,0,0,0.37)}
.ui-preset-neon{border:2px solid var(--cyan)!important;box-shadow:0 0 15px rgba(36,229,201,0.5), inset 0 0 15px rgba(36,229,201,0.2)!important;border-radius:12px}
.ui-preset-gradient{background:linear-gradient(135deg, var(--accent) 0%, #24e5c9 100%)!important;color:#ffffff!important;border:none!important}
.ui-preset-pill{border-radius:999px!important;padding-left:18px!important;padding-right:18px!important}
.ui-preset-retro{border:3px solid #ffffff!important;box-shadow:5px 5px 0px #000000!important;border-radius:0px!important}

.text{width:100%;height:100%;padding:6px;display:flex;align-items:center;overflow:hidden;white-space:pre-wrap}.button{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}.media{width:100%;height:100%;object-fit:cover;display:block}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tool{padding:10px 7px}
.swatches{display:flex;flex-wrap:wrap;gap:7px}.swatch{width:26px;height:26px;border-radius:50%;border:2px solid #fff3;cursor:pointer}.color-row{display:flex;gap:7px;align-items:center}.color-row input[type=color]{width:42px;height:36px;padding:0;border:0;background:transparent}.color-row input[type=text]{flex:1}
.toggle-row{display:flex;gap:6px}.toggle-btn{flex:1;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:7px 0;border-radius:7px;cursor:pointer;font-size:12px}.toggle-btn:hover{border-color:#56566e}.toggle-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:100;align-items:center;justify-content:center}.modal.show{display:flex}.modalbox{width:min(680px,calc(100% - 24px));max-height:90vh;overflow:auto;background:#12121c;border:1px solid #39394c;border-radius:16px;padding:18px;box-shadow:0 30px 100px #000c}.modalbox h2{margin:0 0 15px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.templates{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.template{border:1px solid var(--border);border-radius:10px;padding:11px;background:#171722;cursor:pointer}.template:hover{border-color:var(--accent)}.template strong{display:block;margin-bottom:3px}.template small{color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;background:#171722;border:1px solid #39394b;padding:9px 13px;border-radius:9px;font-size:12px;z-index:200;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:950px){.layout{grid-template-columns:200px minmax(0,1fr)}.right{display:none}}@media(max-width:650px){.layout{grid-template-columns:1fr}.left{display:none}.viewport{padding:10px}.canvas{width:900px}}
</style>
</head>
<body>
<header class="top">
 <div class="brand">Christian's <b>Site Builder</b></div>
 <div class="actions">
  <button class="btn" id="templatesBtn">Templates</button>
  <button class="btn" id="repoBtn">Repository</button>
  <button class="btn" id="loadPublishBtn">Load Live Site</button>
  <button class="btn" id="previewBtn">Preview</button>
  <button class="btn primary" id="publishBtn">Publish to ChrisHub</button>
 </div>
</header>

<div class="layout" id="layout">
<aside class="left" id="leftPanel">
 <div class="panel-toggle"><span class="label" style="margin:0">Panel</span><button class="btn" id="leftToggleBtn">‹ Hide</button></div>
 <div class="panel-body">
 <div class="section"><div class="label">Pages</div><div id="pages" class="pages"></div>
  <div class="grid" style="margin-top:7px"><button class="btn" id="newPage">＋ Page</button><button class="btn danger" id="deletePage">Delete</button></div>
 </div>
 <div class="section"><div class="label">Basic Elements</div><div class="tools">
  <button class="btn tool" data-add="text">＋ Text</button><button class="btn tool" data-add="button">＋ Button</button>
  <button class="btn tool" data-add="image">＋ Image</button><button class="btn tool" data-add="video">＋ Video</button>
 </div></div>
 <div class="section"><div class="label">Premade Items & UI</div>
  <div class="pages">
   <button class="btn" id="addHeaderBlock" style="width:100%;text-align:left;margin-bottom:4px">📌 Hero Header Block</button>
   <button class="btn" id="addNewsCardBlock" style="width:100%;text-align:left;margin-bottom:4px">📰 News Article Card</button>
   <button class="btn" id="addFeatureGridBlock" style="width:100%;text-align:left;margin-bottom:4px">⚡ Feature Highlight Block</button>
  </div>
 </div>
 <div class="section"><div class="label">Templates</div><button class="btn" style="width:100%" id="quickTemplates">Choose template</button></div>
 <div class="section"><div class="label">Page Setup</div>
  <div class="field"><label>Name</label><input id="pageLabel"></div>
  <div class="field"><label>URL slug</label><input id="pageSlug"></div>
 </div>
 </div>
 <div class="resizer" id="leftResizer"></div>
</aside>

<section class="workspace">
 <div class="bar">
  <div style="display:flex;align-items:center;gap:12px;min-width:0">
   <span style="white-space:nowrap"><strong id="pageTitle">Home</strong></span>
   <div class="device-toggle">
    <button class="btn device-btn active" id="devDesktopBtn">🖥 Desktop</button>
    <button class="btn device-btn" id="devPhoneBtn">📱 Phone</button>
    <button class="btn" id="regenPhoneBtn" style="display:none" title="Recreate the phone layout from your current desktop design">↺ Reset from Desktop</button>
   </div>
  </div>
  <div class="zoom-controls">
   <button class="btn" id="zoomOut" title="Zoom out">− Zoom</button>
   <span id="zoomLabel">100%</span>
   <button class="btn" id="zoomIn" title="Zoom in">＋ Zoom</button>
   <button class="btn" id="zoomOutMaxBtn" title="See whole page (15%)">15% Wide</button>
   <button class="btn" id="zoomFitBtn" title="Fit whole page to screen">Fit Screen</button>
   <button class="btn" id="zoom100Btn" title="Actual size">100%</button>
  </div>
 </div>
 <div class="viewport" id="viewport"><div id="canvasWrap" class="canvas-wrap"><div id="canvas" class="canvas"></div></div></div>
</section>

<aside class="right" id="rightPanel">
 <div class="resizer" id="rightResizer"></div>
 <div class="panel-toggle"><button class="btn" id="rightToggleBtn">Hide ›</button><span class="label" style="margin:0">Design & UI</span></div>
 <div class="panel-body">
 <div class="field"><label>Canvas background</label><div class="color-row"><input type="color" id="bgColor"><input type="text" id="bgText"></div></div>
 <div class="label">Theme colors</div>
 <div class="swatches" id="swatches"></div>
 <button class="btn" id="wheelBtn" style="width:100%;margin-top:8px">🎨 Color wheel</button>
 <div style="height:18px"></div>
 <div class="label">Selected Element Inspector</div>
 <div id="inspector" style="color:var(--muted);font-size:12px">Select something on the canvas.</div>
 </div>
</aside>
</div>

<div class="modal" id="modal"><div class="modalbox" id="modalContent"></div></div>
<div class="toast" id="toast"></div>

<script id="sitebuilder-state" type="application/json">null</script>

<script>
const KEY='troy-site-builder-v5';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10), clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let selected=null, drag=null, resize=null, deviceMode='desktop';

const themes={
 Midnight:{bg:'#0b0b10',accent:'#8b6cff',text:'#ffffff',muted:'#9b9baa'},
 Ocean:{bg:'#06131a',accent:'#19c3ff',text:'#f2fbff',muted:'#8caab4'},
 Sunset:{bg:'#190c0b',accent:'#ff795f',text:'#fff7f4',muted:'#c29e96'},
 Forest:{bg:'#08140e',accent:'#41d68b',text:'#f2fff8',muted:'#8fb5a1'},
 Paper:{bg:'#f5f2eb',accent:'#5b48d8',text:'#17151a',muted:'#66616c'},
 Mono:{bg:'#101010',accent:'#ffffff',text:'#ffffff',muted:'#999999'}
};

const FONT_OPTIONS=[
 {id:'inter',label:'Inter (Sans)',css:"'Inter',system-ui,sans-serif"},
 {id:'system',label:'System UI',css:"system-ui,-apple-system,'Segoe UI',sans-serif"},
 {id:'georgia',label:'Georgia (Serif)',css:"Georgia,'Times New Roman',serif"},
 {id:'playfair',label:'Playfair Display',css:"'Playfair Display',Georgia,serif"},
 {id:'merriweather',label:'Merriweather',css:"'Merriweather',Georgia,serif"},
 {id:'poppins',label:'Poppins',css:"'Poppins',sans-serif"},
 {id:'montserrat',label:'Montserrat',css:"'Montserrat',sans-serif"},
 {id:'oswald',label:'Oswald',css:"'Oswald',sans-serif"},
 {id:'courier',label:'Courier New (Mono)',css:"'Courier New',monospace"},
 {id:'firacode',label:'Fira Code (Mono)',css:"'Fira Code',monospace"}
];

const UI_PRESETS=[
 {id:'ui-preset-none',label:'Default / Standard'},
 {id:'ui-preset-card',label:'📦 Translucent Card'},
 {id:'ui-preset-glass',label:'✨ Modern Glassmorphism'},
 {id:'ui-preset-neon',label:'⚡ Neon Glow Border'},
 {id:'ui-preset-gradient',label:'🎨 Vibrant Gradient'},
 {id:'ui-preset-pill',label:'💊 Rounded Pill Style'},
 {id:'ui-preset-retro',label:'🕹️ Retro Shadow Box'}
];

const GOOGLE_FONTS_LINK='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@400;700&family=Merriweather:wght@400;700&family=Poppins:wght@400;700&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">';
function fontCss(id){return (FONT_OPTIONS.find(f=>f.id===id)||FONT_OPTIONS[0]).css}

// --- Phone layout: a second, independent canvas per page ---
const PHONE_W=390, PHONE_H=844;
function scaleElementToPhone(e,sx,sy){
 return {...e,id:uid(),x:Math.round(e.x*sx),y:Math.round(e.y*sy),w:Math.max(24,Math.round(e.w*sx)),h:Math.max(20,Math.round(e.h*sy)),fontSize:Math.max(10,Math.round((e.fontSize||16)*sx))};
}
function ensurePhone(page){
 if(!page.phoneCanvas){
  page.phoneCanvas={w:PHONE_W,h:PHONE_H,bg:page.canvas.bg,colors:page.canvas.colors};
 }
 if(!page.phoneElements){
  const sx=PHONE_W/page.canvas.w, sy=PHONE_H/page.canvas.h;
  page.phoneElements=page.elements.map(e=>scaleElementToPhone(e,sx,sy));
 }
 return page;
}

function pageTemplate(name='Home',slug='index',theme='Midnight'){
 const t=themes[theme];
 return {id:uid(),label:name,slug,theme,canvas:{w:1100,h:850,bg:t.bg,colors:t},elements:[
  {id:uid(),type:'text',x:90,y:90,w:680,h:90,text:'Your new website.',fontSize:54,color:t.text,bold:true,italic:false,underline:false,font:'inter',align:'left',preset:'ui-preset-none'},
  {id:uid(),type:'text',x:92,y:195,w:560,h:70,text:'Edit this text, move it anywhere, and press Enter to save.',fontSize:18,color:t.muted,bold:false,italic:false,underline:false,font:'inter',align:'left',preset:'ui-preset-none'},
  {id:uid(),type:'button',x:92,y:295,w:180,h:52,text:'Get started',fontSize:15,color:'#fff',background:t.accent,radius:12,bold:true,italic:false,underline:false,font:'inter',link:'#',preset:'ui-preset-none'}
 ]};
}

function initial(){
 try{
  const embeddedTag=$('#sitebuilder-state');
  if(embeddedTag&&embeddedTag.textContent.trim()&&embeddedTag.textContent.trim()!=='null'){
   let embeddedData=JSON.parse(embeddedTag.textContent);
   if(embeddedData?.pages?.length) return embeddedData;
  }
  let x=JSON.parse(localStorage.getItem(KEY));
  if(x?.pages?.length)return x;
 }catch(e){}
 return {pages:[pageTemplate()],active:0,repo:{owner:'the-troy-place',name:'the-Troy-place',branch:'main',folder:''}};
}

let state=initial();
function pg(){return state.pages[state.active]}
function canv(){return deviceMode==='phone'?ensurePhone(pg()).phoneCanvas:pg().canvas}
function els(){return deviceMode==='phone'?ensurePhone(pg()).phoneElements:pg().elements}
function find(id){return els().find(e=>e.id===id)}
function save(msg='Saved'){localStorage.setItem(KEY,JSON.stringify(state));if(msg)toast(msg)}
function toast(m){let t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),1300)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function getPageLink(page){
 return page.slug === 'index' ? 'index.html' : page.slug + '.html';
}

function syncNavForList(list,canvasRef,small){
 state.pages.forEach((targetPage,index)=>{
  const targetLink=getPageLink(targetPage);
  let navBtn=list.find(e=>e.type==='button'&&(e.isNav===true||e.link===targetLink||e.text===targetPage.label));
  if(!navBtn){
   const btnWidth=small?92:130, btnHeight=small?32:40, startX=small?16:90, gap=small?8:15;
   navBtn={id:uid(),type:'button',x:startX+index*(btnWidth+gap),y:small?16:30,w:btnWidth,h:btnHeight,text:targetPage.label,fontSize:small?11:14,color:'#ffffff',background:canvasRef.colors.accent,radius:8,bold:true,italic:false,underline:false,font:'inter',link:targetLink,isNav:true,preset:'ui-preset-none',z:list.length+1};
   list.push(navBtn);
  }else{
   navBtn.text=targetPage.label;navBtn.link=targetLink;navBtn.isNav=true;
  }
 });
}
function syncNavigationButtons(){
 state.pages.forEach(page=>{
  ensurePhone(page);
  syncNavForList(page.elements,page.canvas,false);
  syncNavForList(page.phoneElements,page.phoneCanvas,true);
 });
}

function renderPages(){
 $('#pages').innerHTML=state.pages.map((p,i)=>`<div class="page ${i===state.active?'active':''}" data-i="${i}"><span>${esc(p.label)}</span><span class="x">${esc(p.slug)}</span></div>`).join('');
 $$('.page').forEach(n=>n.onclick=()=>{state.active=+n.dataset.i;selected=null;renderAll()});
 $('#pageLabel').value=pg().label;$('#pageSlug').value=pg().slug;$('#pageTitle').textContent=pg().label;
}
function content(e){
 let n;
 const presetClass = e.preset || 'ui-preset-none';
 if(e.type==='text'){n=document.createElement('div');n.className='text '+presetClass;n.textContent=e.text||'Text';n.style.fontSize=e.fontSize+'px';n.style.color=e.color;n.style.fontWeight=e.bold?'700':'400';n.style.fontStyle=e.italic?'italic':'normal';n.style.textDecoration=e.underline?'underline':'none';n.style.fontFamily=fontCss(e.font);n.style.justifyContent=e.align==='center'?'center':e.align==='right'?'flex-end':'flex-start'}
 else if(e.type==='button'){n=document.createElement('div');n.className='button '+presetClass;n.textContent=e.text||'Button';n.style.background=e.background;n.style.color=e.color;n.style.borderRadius=e.radius+'px';n.style.fontSize=e.fontSize+'px';n.style.fontStyle=e.italic?'italic':'normal';n.style.textDecoration=e.underline?'underline':'none';n.style.fontFamily=fontCss(e.font)}
 else if(e.type==='image'){n=document.createElement('img');n.className='media '+presetClass;n.src=e.src||'';n.alt=e.alt||''}
 else {n=document.createElement('video');n.className='media '+presetClass;n.src=e.src||'';n.controls=true}
 return n;
}
function renderCanvas(){
 const c=canv(),node=$('#canvas');node.style.width=c.w+'px';node.style.height=c.h+'px';node.style.background=c.bg;node.innerHTML='';
 node.classList.toggle('phone-frame',deviceMode==='phone');
 els().sort((a,b)=>(a.z||0)-(b.z||0)).forEach(e=>{
  const d=document.createElement('div');d.className='element '+(e.id===selected?'selected':'');d.dataset.id=e.id;
  Object.assign(d.style,{left:e.x+'px',top:e.y+'px',width:e.w+'px',height:e.h+'px',zIndex:e.z||1});
  d.appendChild(content(e));let h=document.createElement('div');h.className='handle';d.appendChild(h);
  d.onpointerdown=onDown;d.ondblclick=()=>{selected=e.id;renderInspector();if(e.type==='text'||e.type==='button')setTimeout(()=>$('#textInput')?.focus(),0)};
  node.appendChild(d);
 });
 applyZoom();
}
function onDown(ev){
 const e=find(ev.currentTarget.dataset.id);if(!e)return;selected=e.id;
 if(ev.target.classList.contains('handle'))resize={e,sx:ev.clientX,sy:ev.clientY,w:e.w,h:e.h};
 else drag={e,sx:ev.clientX,sy:ev.clientY,x:e.x,y:e.y};
 renderCanvas();renderInspector();ev.preventDefault();
}
window.onpointermove=ev=>{
 if(drag){drag.e.x=clamp(drag.x+ev.clientX-drag.sx,0,canv().w-drag.e.w);drag.e.y=clamp(drag.y+ev.clientY-drag.sy,0,canv().h-drag.e.h);renderCanvas()}
 if(resize){resize.e.w=clamp(resize.w+ev.clientX-resize.sx,30,canv().w-resize.e.x);resize.e.h=clamp(resize.h+ev.clientY-resize.sy,25,canv().h-resize.e.y);renderCanvas()}
}
window.onpointerup=()=>{if(drag||resize){drag=resize=null;saveQuiet()}}
function saveQuiet(){localStorage.setItem(KEY,JSON.stringify(state))}

$('#canvas').onclick=ev=>{

function renderInspector(){

 let h='';

 // Selective Premade UI Dropdown (Available for all elements dynamically)
 h+=`<div class="field"><label>🎨 Custom Premade UI Style</label><select id="presetSelect">${UI_PRESETS.map(u=>`<option value="${u.id}" ${(e.preset||'ui-preset-none')===u.id?'selected':''}>${esc(u.label)}</option>`).join('')}</select></div>`;

 if(e.type==='text'||e.type==='button'){

  </div></div>`;
  if(e.type==='text')h+=`<div class="field"><label>Alignment</label><div class="toggle-row">
   <button type="button" class="toggle-btn ${(e.align||'left')==='left'?'active':''}" id="alignLeft">Left</button>

 bind('textInput','text');bind('font','fontSize','num');bind('color','color');bind('link','link');bind('buttonColor','background');bind('radius','radius','num');['x','y','w','h'].forEach(k=>bind(k,k,'num'));bind('src','src');

async function gh(path,options={}){
 let r=state.repo;if(!r?.token)throw Error('Add your GitHub token in Repository first');
 const res=await fetch('https://api.github.com/'+path,{...options,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+r.token,'X-GitHub-Api-Version':'2022-11-28',...(options.headers||{})}});
 const text=await res.text();let data={};try{data=JSON.parse(text)}catch{}
 if(!res.ok)throw Error(data.message||res.statusText);return data;
}
function encBytes(bytes){let s='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)s+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(s)}

function renderElementsHtml(c,elements){
 const fluidFont=px=>{
  const vw=(px/c.w*100).toFixed(3)+'vw';
  const min=Math.max(11,Math.round(px*0.55));
  return `clamp(${min}px, ${vw}, ${px}px)`;
 };
 const inner=elements.map(e=>{
 let innerHtml='';
 const presetClass = e.preset || 'ui-preset-none';
 if(e.type==='text')innerHtml=`<div class="${presetClass}" style="width:100%;height:100%;font-size:${fluidFont(e.fontSize)};font-family:${fontCss(e.font)};font-style:${e.italic?'italic':'normal'};text-decoration:${e.underline?'underline':'none'};color:${esc(e.color)};font-weight:${e.bold?700:400};display:flex;align-items:center;justify-content:${e.align==='center'?'center':e.align==='right'?'flex-end':'flex-start'};padding:6px;box-sizing:border-box;white-space:pre-wrap">${esc(e.text)}</div>`;
 if(e.type==='button')innerHtml=`<div class="${presetClass}" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:${esc(e.background)};color:${esc(e.color)};border-radius:${e.radius}px;font-size:${fluidFont(e.fontSize)};font-family:${fontCss(e.font)};font-style:${e.italic?'italic':'normal'};text-decoration:${e.underline?'underline':'none'};font-weight:700">${esc(e.text)}</div>`;
 if(e.type==='image')innerHtml=`<img class="${presetClass}" src="${esc(e.src)}" style="width:100%;height:100%;object-fit:cover">`;
 if(e.type==='video')innerHtml=`<video class="${presetClass}" src="${esc(e.src)}" controls style="width:100%;height:100%;object-fit:cover"></video>`;
 if(e.type==='button'&&e.link)innerHtml=`<a href="${esc(e.link)}" style="display:block;width:100%;height:100%;text-decoration:none">${innerHtml}</a>`;

 const leftPct=(e.x/c.w)*100;
 const topPct=(e.y/c.h)*100;
 const widthPct=(e.w/c.w)*100;
 const heightPct=(e.h/c.h)*100;

 return `<div style="position:absolute;left:${leftPct}%;top:${topPct}%;width:${widthPct}%;height:${heightPct}%;z-index:${e.z||1}">${innerHtml}</div>`}).join('');

 return `<div style="width:100%;max-width:${c.w}px;margin:0 auto;position:relative;aspect-ratio:${c.w}/${c.h};background:${esc(c.bg)};overflow:hidden">${inner}</div>`;
}

const PHONE_BREAKPOINT=640;
function exportPage(p){
 ensurePhone(p);
 const desktop=renderElementsHtml(p.canvas,p.elements);
 const phone=renderElementsHtml(p.phoneCanvas,p.phoneElements);
 return `<div class="sb-desktop-view">${desktop}</div><div class="sb-phone-view">${phone}</div>`
  +`<style>.sb-phone-view{display:none}@media(max-width:${PHONE_BREAKPOINT}px){.sb-desktop-view{display:none}.sb-phone-view{display:block}}</style>`;
}

async function putFile(path,bytes,message,sha){
 let body={message,content:encBytes(bytes),branch:state.repo.branch||'main'};if(sha)body.sha=sha;
 return gh(`repos/${state.repo.owner}/${state.repo.name}/contents/${path}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
}

async function getSha(path){
 try{
  const res = await gh(`repos/${state.repo.owner}/${state.repo.name}/contents/${path}?ref=${encodeURIComponent(state.repo.branch||'main')}`);
  return res.sha || null;
 }catch(e){
  return null;
 }
}

async function publish(){
 try{
  if(!state.repo?.token) return repoModal();
  state.pages.forEach(ensurePhone);
  const folder=state.repo.folder?state.repo.folder+'/':'';
  for(const p of state.pages){
   const path=folder+(p.slug==='index'?'index.html':p.slug+'.html');
   const sha = await getSha(path);
   await putFile(path,publishPage(p,p.slug==='index'),'Update '+path,sha);
  }
  toast('Published live to GitHub');
 }catch(e){alert('GitHub publish failed: '+e.message)}
}

function decodeBase64Utf8(str) {
 return decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}

async function loadLiveSite(){
 try{
  if(!state.repo?.token) return repoModal();
  const folder=state.repo.folder?state.repo.folder+'/':'';
  const path=folder+'index.html';
  
  toast('Fetching live index.html from GitHub API...');
  
  const res = await gh(`repos/${state.repo.owner}/${state.repo.name}/contents/${path}?ref=${encodeURIComponent(state.repo.branch||'main')}`);
  
  if(!res.content) throw new Error('File contents empty or missing.');
  
  const cleanContent = res.content.replace(/\s/g, '');
  const html = decodeBase64Utf8(cleanContent);

  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const embeddedTag = doc.querySelector('#sitebuilder-state');
  
  if(!embeddedTag || !embeddedTag.textContent.trim() || embeddedTag.textContent.trim() === 'null'){
   throw new Error('No saved site metadata found in the published index.html. Publish from this updated version first.');
  }

  if(!confirm('Revert current workspace to the live published state from GitHub?')) return;
  
  const currentToken = state.repo?.token;
  state = JSON.parse(embeddedTag.textContent);
  state.repo = state.repo || {};
  state.repo.token = currentToken;
  state.pages.forEach(ensurePhone);
  selected = null;
  save('Loaded live site state');
  renderAll();
 }catch(e){
  alert('Load Live Site failed: ' + e.message);
 }
}

$('#loadPublishBtn').onclick=loadLiveSite;

// --- Device toggle ---
function setDevice(mode){
 deviceMode=mode;
 ensurePhone(pg());
 selected=null;
 if(typeof zoomMode!=='undefined')zoomMode='fit';
 $('#devDesktopBtn').classList.toggle('active',mode==='desktop');
 $('#devPhoneBtn').classList.toggle('active',mode==='phone');
 $('#regenPhoneBtn').style.display=mode==='phone'?'inline-block':'none';
 renderAll();
}
$('#devDesktopBtn').onclick=()=>setDevice('desktop');
$('#devPhoneBtn').onclick=()=>setDevice('phone');
$('#regenPhoneBtn').onclick=()=>{
 if(!confirm('Replace your current phone layout with a fresh copy generated from the desktop design? This cannot be undone.'))return;
 const page=pg();
 const sx=PHONE_W/page.canvas.w, sy=PHONE_H/page.canvas.h;
 page.phoneElements=page.elements.map(e=>scaleElementToPhone(e,sx,sy));
 page.phoneCanvas=page.phoneCanvas||{w:PHONE_W,h:PHONE_H,bg:page.canvas.bg,colors:page.canvas.colors};
 selected=null;renderAll();save('Phone layout regenerated from desktop');
};

// --- Resizable / collapsible side panels ---
const PANEL_MIN=180,PANEL_MAX=460,PANEL_COLLAPSED_W=42;
let panelState={leftW:260,rightW:310,leftCollapsed:false,rightCollapsed:false};
function applyPanelWidths(){
 document.documentElement.style.setProperty('--leftw',(panelState.leftCollapsed?PANEL_COLLAPSED_W:panelState.leftW)+'px');
 document.documentElement.style.setProperty('--rightw',(panelState.rightCollapsed?PANEL_COLLAPSED_W:panelState.rightW)+'px');
 $('#leftPanel').classList.toggle('panel-collapsed',panelState.leftCollapsed);
 $('#rightPanel').classList.toggle('panel-collapsed',panelState.rightCollapsed);
 $('#leftToggleBtn').textContent=panelState.leftCollapsed?'›':'‹ Hide';
 $('#rightToggleBtn').textContent=panelState.rightCollapsed?'‹':'Hide ›';
 applyZoom();
}
$('#leftToggleBtn').onclick=()=>{panelState.leftCollapsed=!panelState.leftCollapsed;applyPanelWidths()};
$('#rightToggleBtn').onclick=()=>{panelState.rightCollapsed=!panelState.rightCollapsed;applyPanelWidths()};
function setupResizer(handle,side){
 if(!handle)return;
 handle.onpointerdown=ev=>{
  ev.preventDefault();
  const startX=ev.clientX;
  const startW=side==='left'?panelState.leftW:panelState.rightW;
  handle.classList.add('active');
  function move(e){
   let delta=e.clientX-startX;
   if(side==='right')delta=-delta;
   const w=clamp(startW+delta,PANEL_MIN,PANEL_MAX);
   if(side==='left'){panelState.leftW=w;panelState.leftCollapsed=false}
   else{panelState.rightW=w;panelState.rightCollapsed=false}
   applyPanelWidths();
  }
  function up(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);handle.classList.remove('active')}
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
 };
}
setupResizer($('#leftResizer'),'left');
setupResizer($('#rightResizer'),'right');
applyPanelWidths();

// --- Expanded Canvas Zoom (15% to 200%) ---
let zoomMode='fit', manualZoom=1;
function computeFitScale(){
 const vp=$('#viewport'),c=canv();
 const pad=80;
 const availW=Math.max(80,vp.clientWidth-pad);
 const availH=Math.max(80,vp.clientHeight-pad);
 return Math.min(1,availW/c.w,availH/c.h);
}
function applyZoom(){
 const c=canv();
 let scale=zoomMode==='fit'?computeFitScale():manualZoom;
 scale=Math.max(0.15,Math.min(scale,2.0));
 const canvasEl=$('#canvas'),wrap=$('#canvasWrap');
 if(!canvasEl||!wrap)return;
 canvasEl.style.transform='scale('+scale+')';
 canvasEl.style.transformOrigin='top center';
 wrap.style.width=(c.w*scale)+'px';
 wrap.style.height=(c.h*scale)+'px';
 $('#zoomLabel').textContent=Math.round(scale*100)+'%';
}
function nudgeZoom(delta){
 const base=zoomMode==='fit'?computeFitScale():manualZoom;
 manualZoom=Math.max(0.15,Math.min(Math.round((base+delta)*100)/100,2.0));
 zoomMode='manual';
 applyZoom();
}
$('#zoomIn').onclick=()=>nudgeZoom(0.1);
$('#zoomOut').onclick=()=>nudgeZoom(-0.1);
$('#zoomOutMaxBtn').onclick=()=>{zoomMode='manual';manualZoom=0.15;applyZoom()};
$('#zoomFitBtn').onclick=()=>{zoomMode='fit';applyZoom()};
$('#zoom100Btn').onclick=()=>{zoomMode='manual';manualZoom=1;applyZoom()};
window.addEventListener('resize',applyZoom);

syncNavigationButtons();
renderAll();
</script>
