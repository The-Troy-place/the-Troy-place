<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>christians site builder</title>
<style>
:root{--bg:#08080d;--panel:#11111a;--panel2:#171722;--text:#f7f7fb;--muted:#9999aa;--border:#29293a;--accent:#8b6cff;--cyan:#24e5c9;--danger:#ff6d83}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}
.top{height:62px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;background:#09090ef2;backdrop-filter:blur(12px);z-index:30}.brand{font-weight:900}.brand b{color:var(--cyan)}
.actions{display:flex;gap:7px}.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:9px;font-size:12px;font-weight:750;cursor:pointer}.btn:hover{border-color:#56566e}.primary{background:var(--accent);border-color:var(--accent)}.danger{color:var(--danger)}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr) 300px;min-height:calc(100vh - 62px)}aside{padding:14px;background:#0d0d15}.left{border-right:1px solid var(--border)}.right{border-left:1px solid var(--border)}
.section{margin-bottom:18px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#707082;font-weight:850;margin-bottom:8px}.pages{display:grid;gap:5px}.page{padding:9px;border-radius:8px;color:var(--muted);display:flex;justify-content:space-between;cursor:pointer}.page.active{background:#211c38;color:white}.page:hover{background:#191925;color:white}.page .x{opacity:.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.field{margin:0 0 10px}.field label{display:block;color:#878798;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#0a0a10;border:1px solid var(--border);color:white;border-radius:8px;padding:8px;outline:none}.field textarea{min-height:70px;resize:vertical}
.workspace{min-width:0;background:#090910}.bar{height:46px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:var(--muted);font-size:11px}.bar strong{color:white}.viewport{height:calc(100vh - 108px);overflow:auto;padding:30px;display:flex;justify-content:center;background-image:radial-gradient(#20202b 1px,transparent 1px);background-size:18px 18px}
.canvas{position:relative;flex:none;overflow:hidden;box-shadow:0 25px 80px #0008}.element{position:absolute;border:1px solid transparent;user-select:none;cursor:move}.element.selected{border-color:var(--accent);box-shadow:0 0 0 2px #8b6cff22}.handle{display:none;position:absolute;right:-5px;bottom:-5px;width:10px;height:10px;border-radius:3px;background:var(--accent);cursor:nwse-resize}.selected .handle{display:block}
.text{width:100%;height:100%;padding:2px;display:flex;align-items:center;overflow:hidden;white-space:pre-wrap}.button{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}.media{width:100%;height:100%;object-fit:cover;display:block}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tool{padding:10px 7px}
.swatches{display:flex;flex-wrap:wrap;gap:7px}.swatch{width:26px;height:26px;border-radius:50%;border:2px solid #fff3;cursor:pointer}.color-row{display:flex;gap:7px;align-items:center}.color-row input[type=color]{width:42px;height:36px;padding:0;border:0;background:transparent}.color-row input[type=text]{flex:1}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:100;align-items:center;justify-content:center}.modal.show{display:flex}.modalbox{width:min(620px,calc(100% - 24px));max-height:90vh;overflow:auto;background:#12121c;border:1px solid #39394c;border-radius:16px;padding:18px;box-shadow:0 30px 100px #000c}.modalbox h2{margin:0 0 15px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.templates{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.template{border:1px solid var(--border);border-radius:10px;padding:11px;background:#171722;cursor:pointer}.template:hover{border-color:var(--accent)}.template strong{display:block;margin-bottom:3px}.template small{color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;background:#171722;border:1px solid #39394b;padding:9px 13px;border-radius:9px;font-size:12px;z-index:200;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:950px){.layout{grid-template-columns:200px minmax(0,1fr)}.right{display:none}}@media(max-width:650px){.layout{grid-template-columns:1fr}.left{display:none}.viewport{padding:10px}.canvas{width:900px}}
</style>
</head>
<body>
<header class="top">
 <div class="brand">Troy <b>Site Builder</b></div>
 <div class="actions">
  <button class="btn" id="templatesBtn">Templates</button>
  <button class="btn" id="repoBtn">Repository</button>
  <button class="btn" id="previewBtn">Preview</button>
  <button class="btn primary" id="publishBtn">Publish to GitHub</button>
 </div>
</header>

<div class="layout">
<aside class="left">
 <div class="section"><div class="label">Pages</div><div id="pages" class="pages"></div>
  <div class="grid" style="margin-top:7px"><button class="btn" id="newPage">＋ Page</button><button class="btn danger" id="deletePage">Delete</button></div>
 </div>
 <div class="section"><div class="label">Add</div><div class="tools">
  <button class="btn tool" data-add="text">＋ Text</button><button class="btn tool" data-add="button">＋ Button</button>
  <button class="btn tool" data-add="image">＋ Image</button><button class="btn tool" data-add="video">＋ Video</button>
 </div></div>
 <div class="section"><div class="label">Templates</div><button class="btn" style="width:100%" id="quickTemplates">Choose template</button></div>
 <div class="section"><div class="label">Page</div>
  <div class="field"><label>Name</label><input id="pageLabel"></div>
  <div class="field"><label>URL slug</label><input id="pageSlug"></div>
 </div>
</aside>

<section class="workspace">
 <div class="bar"><span><strong id="pageTitle">Home</strong> · click anywhere to add text</span><span>Drag · resize · Enter saves text</span></div>
 <div class="viewport"><div id="canvas" class="canvas"></div></div>
</section>

<aside class="right">
 <div class="label">Design</div>
 <div class="field"><label>Canvas background</label><div class="color-row"><input type="color" id="bgColor"><input type="text" id="bgText"></div></div>
 <div class="label">Theme colors</div>
 <div class="swatches" id="swatches"></div>
 <button class="btn" id="wheelBtn" style="width:100%;margin-top:8px">🎨 Color wheel</button>
 <div style="height:18px"></div>
 <div class="label">Selected element</div>
 <div id="inspector" style="color:var(--muted);font-size:12px">Select something on the canvas.</div>
</aside>
</div>

<div class="modal" id="modal"><div class="modalbox" id="modalContent"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='troy-site-builder-v5';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10), clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let selected=null, drag=null, resize=null;

const themes={
 Midnight:{bg:'#0b0b10',accent:'#8b6cff',text:'#ffffff',muted:'#9b9baa'},
 Ocean:{bg:'#06131a',accent:'#19c3ff',text:'#f2fbff',muted:'#8caab4'},
 Sunset:{bg:'#190c0b',accent:'#ff795f',text:'#fff7f4',muted:'#c29e96'},
 Forest:{bg:'#08140e',accent:'#41d68b',text:'#f2fff8',muted:'#8fb5a1'},
 Paper:{bg:'#f5f2eb',accent:'#5b48d8',text:'#17151a',muted:'#66616c'},
 Mono:{bg:'#101010',accent:'#ffffff',text:'#ffffff',muted:'#999999'}
};

function pageTemplate(name='Home',slug='index',theme='Midnight'){
 const t=themes[theme];
 return {id:uid(),label:name,slug,theme,canvas:{w:1100,h:720,bg:t.bg,colors:t},elements:[
  {id:uid(),type:'text',x:90,y:90,w:680,h:90,text:'Your new website.',fontSize:54,color:t.text,bold:true,align:'left'},
  {id:uid(),type:'text',x:92,y:195,w:560,h:70,text:'Edit this text, move it anywhere, and press Enter to save.',fontSize:18,color:t.muted,bold:false,align:'left'},
  {id:uid(),type:'button',x:92,y:295,w:180,h:52,text:'Get started',fontSize:15,color:'#fff',background:t.accent,radius:12,bold:true,link:'#'}
 ]};
}
function initial(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x?.pages?.length)return x}catch(e){}return {pages:[pageTemplate()],active:0,repo:{owner:'the-troy-place',name:'the-Troy-place',branch:'main',folder:''}}}
let state=initial();
function pg(){return state.pages[state.active]} function els(){return pg().elements} function find(id){return els().find(e=>e.id===id)}
function save(msg='Saved'){localStorage.setItem(KEY,JSON.stringify(state));if(msg)toast(msg)}
function toast(m){let t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),1300)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function renderPages(){
 $('#pages').innerHTML=state.pages.map((p,i)=>`<div class="page ${i===state.active?'active':''}" data-i="${i}"><span>${esc(p.label)}</span><span class="x">${esc(p.slug)}</span></div>`).join('');
 $$('.page').forEach(n=>n.onclick=()=>{state.active=+n.dataset.i;selected=null;renderAll()});
 $('#pageLabel').value=pg().label;$('#pageSlug').value=pg().slug;$('#pageTitle').textContent=pg().label;
}
function content(e){
 let n;
 if(e.type==='text'){n=document.createElement('div');n.className='text';n.textContent=e.text||'Text';n.style.fontSize=e.fontSize+'px';n.style.color=e.color;n.style.fontWeight=e.bold?'700':'400';n.style.justifyContent=e.align==='center'?'center':e.align==='right'?'flex-end':'flex-start'}
 else if(e.type==='button'){n=document.createElement('div');n.className='button';n.textContent=e.text||'Button';n.style.background=e.background;n.style.color=e.color;n.style.borderRadius=e.radius+'px';n.style.fontSize=e.fontSize+'px'}
 else if(e.type==='image'){n=document.createElement('img');n.className='media';n.src=e.src||'';n.alt=e.alt||''}
 else {n=document.createElement('video');n.className='media';n.src=e.src||'';n.controls=true}
 return n;
}
function renderCanvas(){
 const c=pg().canvas,node=$('#canvas');node.style.width=c.w+'px';node.style.height=c.h+'px';node.style.background=c.bg;node.innerHTML='';
 els().sort((a,b)=>(a.z||0)-(b.z||0)).forEach(e=>{
  const d=document.createElement('div');d.className='element '+(e.id===selected?'selected':'');d.dataset.id=e.id;
  Object.assign(d.style,{left:e.x+'px',top:e.y+'px',width:e.w+'px',height:e.h+'px',zIndex:e.z||1});
  d.appendChild(content(e));let h=document.createElement('div');h.className='handle';d.appendChild(h);
  d.onpointerdown=onDown;d.ondblclick=()=>{selected=e.id;renderInspector();if(e.type==='text'||e.type==='button')setTimeout(()=>$('#textInput')?.focus(),0)};
  node.appendChild(d);
 });
}
function onDown(ev){
 const e=find(ev.currentTarget.dataset.id);if(!e)return;selected=e.id;
 if(ev.target.classList.contains('handle'))resize={e,sx:ev.clientX,sy:ev.clientY,w:e.w,h:e.h};
 else drag={e,sx:ev.clientX,sy:ev.clientY,x:e.x,y:e.y};
 renderCanvas();renderInspector();ev.preventDefault();
}
window.onpointermove=ev=>{
 if(drag){drag.e.x=clamp(drag.x+ev.clientX-drag.sx,0,pg().canvas.w-drag.e.w);drag.e.y=clamp(drag.y+ev.clientY-drag.sy,0,pg().canvas.h-drag.e.h);renderCanvas()}
 if(resize){resize.e.w=clamp(resize.w+ev.clientX-resize.sx,30,pg().canvas.w-resize.e.x);resize.e.h=clamp(resize.h+ev.clientY-resize.sy,25,pg().canvas.h-resize.e.y);renderCanvas()}
}
window.onpointerup=()=>{if(drag||resize){drag=resize=null;saveQuiet()}}
function saveQuiet(){localStorage.setItem(KEY,JSON.stringify(state))}

$('#canvas').onclick=ev=>{
 if(ev.target!==$('#canvas'))return;
 const r=$('#canvas').getBoundingClientRect();let e={id:uid(),type:'text',x:clamp(ev.clientX-r.left,5,pg().canvas.w-250),y:clamp(ev.clientY-r.top,5,pg().canvas.h-60),w:300,h:55,text:'Type here',fontSize:24,color:pg().canvas.colors.text,bold:false,align:'left',z:els().length+1};
 els().push(e);selected=e.id;renderAll();setTimeout(()=>$('#textInput')?.focus(),0);
}

function renderInspector(){
 const e=find(selected),box=$('#inspector');
 if(!e){box.textContent='Select something on the canvas.';return}
 let h='';
 if(e.type==='text'||e.type==='button'){
  h+=`<div class="field"><label>Text</label><textarea id="textInput">${esc(e.text)}</textarea></div>`;
  h+=`<div class="grid"><div class="field"><label>Font</label><input id="font" type="number" value="${e.fontSize}"></div><div class="field"><label>Text color</label><input id="color" value="${esc(e.color)}"></div></div>`;
  if(e.type==='button')h+=`<div class="field"><label>Link</label><input id="link" value="${esc(e.link||'')}"></div><div class="grid"><div class="field"><label>Button color</label><input id="buttonColor" value="${esc(e.background)}"></div><div class="field"><label>Radius</label><input id="radius" type="number" value="${e.radius}"></div></div>`;
 }else{h+=`<div class="field"><label>Source URL</label><input id="src" value="${esc(e.src||'')}"></div><button class="btn" id="deviceUpload">Choose from device</button>`}
 h+=`<div class="grid" style="margin-top:10px"><div class="field"><label>X</label><input id="x" type="number" value="${Math.round(e.x)}"></div><div class="field"><label>Y</label><input id="y" type="number" value="${Math.round(e.y)}"></div><div class="field"><label>Width</label><input id="w" type="number" value="${Math.round(e.w)}"></div><div class="field"><label>Height</label><input id="h" type="number" value="${Math.round(e.h)}"></div></div>`;
 h+=`<div class="grid"><button class="btn" id="dup">Duplicate</button><button class="btn danger" id="del">Delete</button></div>`;
 box.innerHTML=h;
 const bind=(id,key,type='text')=>{let n=$('#'+id);if(!n)return;n.oninput=()=>{e[key]=type==='num'?Number(n.value):n.value;renderCanvas();saveQuiet()};n.onkeydown=ev=>{if(ev.key==='Enter'&&(type!=='text'||!ev.shiftKey)){ev.preventDefault();save('Text saved')}}};
 bind('textInput','text');bind('font','fontSize','num');bind('color','color');bind('link','link');bind('buttonColor','background');bind('radius','radius','num');['x','y','w','h'].forEach(k=>bind(k,k,'num'));bind('src','src');
 const dupBtn=$('#dup'),delBtn=$('#del');if(dupBtn)dupBtn.onclick=()=>duplicate();if(delBtn)delBtn.onclick=()=>remove();
 $('#deviceUpload')?.addEventListener('click',()=>deviceFor(e));
}
function duplicate(){let e=find(selected);if(!e)return;let n=JSON.parse(JSON.stringify(e));n.id=uid();n.x+=25;n.y+=25;n.z=els().length+1;els().push(n);selected=n.id;renderAll();save()}
function remove(){if(!selected)return;pg().elements=els().filter(e=>e.id!==selected);selected=null;renderAll();save()}

function add(type){let c=pg().canvas,e={id:uid(),type,x:80,y:80,w:type==='button'?180:type==='text'?320:360,h:type==='text'?60:type==='button'?52:240,z:els().length+1};
 if(type==='text')Object.assign(e,{text:'Type here',fontSize:24,color:c.colors.text,bold:false,align:'left'});
 if(type==='button')Object.assign(e,{text:'Button',fontSize:15,color:'#fff',background:c.colors.accent,radius:12,bold:true,link:''});
 if(type==='image')Object.assign(e,{src:'',alt:''});
 if(type==='video')Object.assign(e,{src:'',alt:''});
 els().push(e);selected=e.id;renderAll();save();
}
$$('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));

$('#newPage').onclick=()=>{
 let n=pageTemplate('New page','page-'+(state.pages.length+1),pg().theme||'Midnight');n.elements=[];
 state.pages.push(n);state.active=state.pages.length-1;selected=null;renderAll();save('Page created');
};
$('#deletePage').onclick=()=>{
 if(state.pages.length===1)return toast('You need at least one page');
 if(!confirm('Delete this page? This cannot be undone.'))return;
 state.pages.splice(state.active,1);state.active=Math.max(0,state.active-1);selected=null;renderAll();save('Page deleted');
};
$('#pageLabel').oninput=e=>{pg().label=e.target.value;$('#pageTitle').textContent=e.target.value;saveQuiet()};
$('#pageLabel').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur();save('Page name saved')}};
$('#pageSlug').oninput=e=>{pg().slug=e.target.value.toLowerCase().replace(/[^a-z0-9-_]/g,'-');saveQuiet()};
$('#pageSlug').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur();save('URL saved')}};

function applyTheme(name){let t=themes[name],p=pg(),old=themes[p.theme];p.elements.forEach(e=>{if(e.type==='text'&&e.color===old?.text)e.color=t.text});p.theme=name;p.canvas.bg=t.bg;p.canvas.colors=t;renderAll();save('Theme applied')}
function renderThemes(){
 $('#swatches').innerHTML=Object.entries(themes).map(([n,t])=>`<div title="${n}" class="swatch" style="background:${t.accent}" data-theme="${n}"></div>`).join('');
 $$('.swatch').forEach(x=>x.onclick=()=>applyTheme(x.dataset.theme));
}
function templateData(kind){
 if(kind==='Landing')return pageTemplate('Home','index','Midnight');
 if(kind==='Portfolio'){let p=pageTemplate('Portfolio','index','Ocean');p.elements[0].text='Selected work.';p.elements[1].text='A clean portfolio template with room for projects, services, and links.';return p}
 if(kind==='Store'){let p=pageTemplate('Shop','index','Forest');p.elements[0].text='Your store.';p.elements[1].text='Add products, images, and purchase links anywhere.';return p}
 let p=pageTemplate('News','index','Paper');p.elements[0].text='The latest.';p.elements[1].text='A flexible editorial template.';return p;
}
function openTemplates(){
 $('#modal').classList.add('show');$('#modal').innerHTML='<div class="modalbox"><h2>Templates</h2><div class="templates">'+['Landing','Portfolio','Store','News'].map(x=>`<div class="template" data-template="${x}"><strong>${x}</strong><small>Start with this layout and customize everything.</small></div>`).join('')+'</div><div class="modal-actions"><button class="btn" id="closeModal">Close</button></div></div>';
 $$('.template').forEach(x=>x.onclick=()=>{let p=templateData(x.dataset.template);state.pages.push(p);state.active=state.pages.length-1;selected=null;closeModal();renderAll();save('Template added')});$('#closeModal').onclick=closeModal;
}
function closeModal(){$('#modal').classList.remove('show')}
$('#templatesBtn').onclick=openTemplates;$('#quickTemplates').onclick=openTemplates;

$('#wheelBtn').onclick=colorWheel;

function colorWheel(){
 $('#modal').classList.add('show');$('#modal').innerHTML=`<div class="modalbox"><h2>🎨 Color wheel</h2><div class="field"><label>Pick a color</label><input id="wheel" type="color" style="width:100%;height:180px;padding:0"></div><div class="modal-actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="apply">Apply</button></div></div>`;
 $('#cancel').onclick=closeModal;$('#apply').onclick=()=>{pg().canvas.bg=$('#wheel').value;pg().canvas.colors.accent=$('#wheel').value;renderAll();save('Color applied');closeModal()}
}
$('#bgColor').oninput=e=>{pg().canvas.bg=e.target.value;$('#bgText').value=e.target.value;renderCanvas();saveQuiet()};
$('#bgText').onkeydown=e=>{if(e.key==='Enter'){pg().canvas.bg=e.target.value;$('#bgColor').value=e.target.value;renderCanvas();save('Background saved')}};

function deviceFor(e){
 const inp=document.createElement('input');inp.type='file';inp.accept=e.type==='video'?'video/*':'image/*';inp.onchange=()=>{
  const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{e.src=r.result;renderAll();save('Media added')};r.readAsDataURL(f)
 };inp.click()
}

function repoModal(){
 let r=state.repo||{};
 $('#modal').classList.add('show');$('#modal').innerHTML=`<div class="modalbox"><h2>GitHub Repository</h2>
 <p style="color:var(--muted);font-size:12px">The builder uses your GitHub token in your browser to create, update, delete, and publish files. It is not sent anywhere except GitHub's API.</p>
 ${f('GitHub token','password','token',r.token||'')}${f('Owner','text','owner',r.owner||'the-troy-place')}${f('Repository','text','name',r.name||'the-Troy-place')}${f('Branch','text','branch',r.branch||'main')}${f('Site folder','text','folder',r.folder||'')}
 <div class="modal-actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="saveRepo">Save connection</button></div></div>`;
 $('#cancel').onclick=closeModal;$('#saveRepo').onclick=()=>{state.repo={token:$('#token').value,owner:$('#owner').value.trim(),name:$('#name').value.trim(),branch:$('#branch').value.trim()||'main',folder:$('#folder').value.trim().replace(/^\/|\/$/g,'')};save('Repository saved');closeModal()}
}
function f(label,type,id,val){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(val)}"></div>`}
$('#repoBtn').onclick=repoModal;

async function gh(path,options={}){
 let r=state.repo;if(!r?.token)throw Error('Add your GitHub token in Repository first');
 const res=await fetch('https://api.github.com/'+path,{...options,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+r.token,'X-GitHub-Api-Version':'2022-11-28',...(options.headers||{})}});
 const text=await res.text();let data={};try{data=JSON.parse(text)}catch{}
 if(!res.ok)throw Error(data.message||res.statusText);return data;
}
function encBytes(bytes){let s='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)s+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(s)}
function publishPage(p){
 const html='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(p.label)+'</title></head><body style="margin:0">'+exportPage(p)+'</body></html>';
 return new TextEncoder().encode(html);
}
function exportPage(p){
 const c=p.canvas;
 return `<div style="position:relative;width:${c.w}px;height:${c.h}px;background:${esc(c.bg)};overflow:hidden">`+p.elements.map(e=>{
 let inner='';
 if(e.type==='text')inner=`<div style="width:100%;height:100%;font-size:${e.fontSize}px;color:${esc(e.color)};font-weight:${e.bold?700:400};display:flex;align-items:center;justify-content:${e.align==='center'?'center':e.align==='right'?'flex-end':'flex-start'};padding:2px;box-sizing:border-box;white-space:pre-wrap">${esc(e.text)}</div>`;
 if(e.type==='button')inner=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:${esc(e.background)};color:${esc(e.color)};border-radius:${e.radius}px;font-size:${e.fontSize}px;font-weight:700">${esc(e.text)}</div>`;
 if(e.type==='image')inner=`<img src="${esc(e.src)}" style="width:100%;height:100%;object-fit:cover">`;
 if(e.type==='video')inner=`<video src="${esc(e.src)}" controls style="width:100%;height:100%;object-fit:cover"></video>`;
 if(e.type==='button'&&e.link)inner=`<a href="${esc(e.link)}" style="display:block;width:100%;height:100%;text-decoration:none">${inner}</a>`;
 return `<div style="position:absolute;left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;z-index:${e.z||1}">${inner}</div>`}).join('')+'</div>';
}
async function putFile(path,bytes,message,sha){
 let body={message,content:encBytes(bytes),branch:state.repo.branch};if(sha)body.sha=sha;
 return gh(`repos/${state.repo.owner}/${state.repo.name}/contents/${path}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
}
async function getSha(path){try{return (await gh(`repos/${state.repo.owner}/${state.repo.name}/contents/${path}?ref=${encodeURIComponent(state.repo.branch)}`)).sha}catch(e){return null}}
async function publish(){
 try{
  if(!state.repo?.token) return repoModal();
  const folder=state.repo.folder?state.repo.folder+'/':'';
  for(const p of state.pages){
   const path=folder+(p.slug==='index'?'index.html':p.slug+'.html');
   await putFile(path,publishPage(p),'Update '+path,await getSha(path));
  }
  toast('Published to GitHub');
 }catch(e){alert('GitHub publish failed: '+e.message)}
}
$('#publishBtn').onclick=publish;
$('#previewBtn').onclick=()=>{const w=window.open();if(w)w.document.write('<!doctype html><html><body style="margin:0">'+exportPage(pg())+'</body></html>')};

function renderAll(){renderPages();renderCanvas();renderInspector();renderThemes();$('#bgColor').value=pg().canvas.bg;$('#bgText').value=pg().canvas.bg}
renderAll();
</script>
</body></html>
