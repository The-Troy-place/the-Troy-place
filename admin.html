<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Builder</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --panel: #2b2b3d;
      --text: #cdd6f4;
      --accent: #89b4fa;
      --accent-hover: #b4befe;
      --danger: #f38ba8;
      --border: #45475a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 320px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      overflow-y: auto;
    }
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #toolbar {
      height: 50px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    #viewport {
      flex: 1;
      background: #11111b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: auto;
    }
    #canvas {
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #000000;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: auto;
    }
    .btn {
      background: var(--accent);
      color: #11111b;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { background: var(--border); }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label { font-size: 0.85rem; color: #a6adc8; }
    input, select, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px;
      border-radius: 4px;
      font-family: inherit;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 8px;
      width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>Site Builder</h2>
    
    <div class="input-group">
      <label>Page Title</label>
      <input type="text" id="page-label-input" placeholder="Home Page">
    </div>

    <div style="display: flex; gap: 8px;">
      <button class="btn btn-outline" style="flex:1;" onclick="openRepoModal()">Repo Setup</button>
      <button class="btn btn-outline" style="flex:1;" onclick="loadLiveSite()">Load Live</button>
    </div>

    <button class="btn" onclick="publish()">Publish to GitHub</button>
    <div id="status-msg" style="font-size:0.85rem; color: var(--accent);"></div>
  </div>

  <div id="main">
    <div id="toolbar">
      <span id="repo-indicator" style="font-size:0.85rem; color: #a6adc8;">Repo: Not Configured</span>
      <div>
        <button class="btn btn-outline" onclick="clearCanvas()">Clear</button>
      </div>
    </div>
    <div id="viewport">
      <div id="canvas" contenteditable="true">
        <h1>Welcome to Your New Website</h1>
        <p>Edit this content directly on the canvas and click Publish to sync to GitHub!</p>
      </div>
    </div>
  </div>

  <!-- Repo Modal -->
  <div id="repo-modal" class="modal hidden">
    <div class="modal-content">
      <h3>GitHub Repository Setup</h3>
      <div class="input-group">
        <label>GitHub Personal Access Token</label>
        <input type="password" id="repo-token" placeholder="ghp_xxxxxxxxxxxx">
      </div>
      <div class="input-group">
        <label>Owner (Username or Org)</label>
        <input type="text" id="repo-owner" placeholder="octocat">
      </div>
      <div class="input-group">
        <label>Repository Name</label>
        <input type="text" id="repo-name" placeholder="my-website">
      </div>
      <div class="input-group">
        <label>Branch</label>
        <input type="text" id="repo-branch" value="main">
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-outline" onclick="closeRepoModal()">Cancel</button>
        <button class="btn" onclick="saveRepoSettings()">Save Settings</button>
      </div>
    </div>
  </div>

  <script>
    // --- APP STATE ---
    let state = {
      label: "Home Page",
      version: 2, // Current schema version
      content: "",
      repo: {
        token: "",
        owner: "",
        name: "",
        branch: "main"
      }
    };

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      const savedState = localStorage.getItem('sitebuilder_state');
      if (savedState) {
        try {
          const parsed = JSON.parse(savedState);
          hydrateState(parsed);
        } catch(e) {
          console.error("Error loading local state:", e);
        }
      }
      updateUI();
    });

    function saveLocal() {
      state.content = document.getElementById('canvas').innerHTML;
      state.label = document.getElementById('page-label-input').value || "Home Page";
      localStorage.setItem('sitebuilder_state', JSON.stringify(state));
    }

    document.getElementById('canvas').addEventListener('input', saveLocal);
    document.getElementById('page-label-input').addEventListener('input', saveLocal);

    // --- HELPER: HYDRATE/MIGRATE STATE (Universal Version Loader) ---
    function hydrateState(incomingData) {
      if (!incomingData || typeof incomingData !== 'object') return;

      // Handle unversioned or legacy payload shapes seamlessly
      if (incomingData.content !== undefined) {
        state.content = incomingData.content;
      } else if (incomingData.html !== undefined) {
        // Support legacy schema field 'html'
        state.content = incomingData.html;
      }

      if (incomingData.label) state.label = incomingData.label;

      // Retain repo configuration if present in local state, but don't overwrite with blank token
      if (incomingData.repo) {
        state.repo.owner = incomingData.repo.owner || state.repo.owner;
        state.repo.name = incomingData.repo.name || state.repo.name;
        state.repo.branch = incomingData.repo.branch || state.repo.branch || "main";
        if (incomingData.repo.token) {
          state.repo.token = incomingData.repo.token;
        }
      }

      updateUI();
    }

    function updateUI() {
      document.getElementById('canvas').innerHTML = state.content || "<h1>New Page</h1>";
      document.getElementById('page-label-input').value = state.label || "Home Page";
      
      const indicator = document.getElementById('repo-indicator');
      if (state.repo.owner && state.repo.name) {
        indicator.textContent = `Repo: ${state.repo.owner}/${state.repo.name} (${state.repo.branch})`;
      } else {
        indicator.textContent = "Repo: Not Configured";
      }
    }

    // --- REPO MODAL HANDLERS ---
    function openRepoModal() {
      document.getElementById('repo-token').value = state.repo.token || "";
      document.getElementById('repo-owner').value = state.repo.owner || "";
      document.getElementById('repo-name').value = state.repo.name || "";
      document.getElementById('repo-branch').value = state.repo.branch || "main";
      document.getElementById('repo-modal').classList.remove('hidden');
    }

    function closeRepoModal() {
      document.getElementById('repo-modal').classList.add('hidden');
    }

    function saveRepoSettings() {
      state.repo.token = document.getElementById('repo-token').value.trim();
      state.repo.owner = document.getElementById('repo-owner').value.trim();
      state.repo.name = document.getElementById('repo-name').value.trim();
      state.repo.branch = document.getElementById('repo-branch').value.trim() || "main";
      saveLocal();
      closeRepoModal();
      setStatus("Repository settings updated.");
    }

    function setStatus(msg) {
      document.getElementById('status-msg').textContent = msg;
    }

    function esc(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function clearCanvas() {
      if (confirm("Are you sure you want to clear the canvas?")) {
        document.getElementById('canvas').innerHTML = "";
        saveLocal();
      }
    }

    // --- EXPORT & PUBLISH (SAFE TOKEN REMOVAL) ---
    function exportPage(p) {
      return `<div id="site-root">${document.getElementById('canvas').innerHTML}</div>`;
    }

    function publishPage(p) {
      // 1. Clone state object
      const cleanState = JSON.parse(JSON.stringify(state));
      cleanState.content = document.getElementById('canvas').innerHTML;
      cleanState.label = document.getElementById('page-label-input').value;
      
      // 2. CRITICAL FIX: Strip sensitive tokens to prevent GitHub Secret Scanner blocks
      if (cleanState.repo && cleanState.repo.token) {
        delete cleanState.repo.token;
      }

      // 3. Stringify payload safely
      const stateJson = JSON.stringify(cleanState).replace(/-->/g, '--&gt;');
      
      // 4. Construct production index.html
      const html = '<!doctype html><html style="width:100%;height:100%"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(cleanState.label) + '</title></head><body style="margin:0;width:100%;height:100%">' + exportPage(cleanState) + '<!-- SITEBUILDER_DATA:' + stateJson + ' --></body></html>';
      
      return new TextEncoder().encode(html);
    }

    async function publish() {
      if (!state.repo.token || !state.repo.owner || !state.repo.name) {
        alert("Please setup your GitHub repository settings first!");
        openRepoModal();
        return;
      }

      setStatus("Publishing to GitHub...");

      try {
        const path = "index.html";
        const url = `https://api.github.com/repos/${state.repo.owner}/${state.repo.name}/contents/${path}`;
        
        // Check for existing sha (required for updating files on GitHub API)
        let sha = null;
        const getRes = await fetch(`${url}?ref=${state.repo.branch}`, {
          headers: {
            'Authorization': `token ${state.repo.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (getRes.ok) {
          const getData = await getRes.json();
          sha = getData.sha;
        }

        const fileBytes = publishPage(state);
        // Convert Uint8Array to base64 safely
        let binary = '';
        const len = fileBytes.byteLength;
        for (let i = 0; i < len; i++) {
          binary += String.fromCharCode(fileBytes[i]);
        }
        const contentBase64 = btoa(binary);

        const body = {
          message: `Updated site via SiteBuilder (${new Date().toLocaleString()})`,
          content: contentBase64,
          branch: state.repo.branch
        };
        if (sha) body.sha = sha;

        const putRes = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${state.repo.token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify(body)
        });

        if (!putRes.ok) {
          const errData = await putRes.json();
          throw new Error(errData.message || "Failed to commit file to GitHub.");
        }

        setStatus("Published successfully!");
        saveLocal();
      } catch (e) {
        console.error(e);
        setStatus("Error: " + e.message);
        alert("Publish failed: " + e.message);
      }
    }

    // --- UNIVERSAL LOAD LIVE SITE ---
    async function loadLiveSite() {
      if (!state.repo.token || !state.repo.owner || !state.repo.name) {
        alert("Please set up repository credentials first.");
        openRepoModal();
        return;
      }

      setStatus("Fetching live site from GitHub...");

      try {
        const url = `https://api.github.com/repos/${state.repo.owner}/${state.repo.name}/contents/index.html?ref=${state.repo.branch}`;
        const res = await fetch(url, {
          headers: {
            'Authorization': `token ${state.repo.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!res.ok) throw new Error("Could not fetch index.html from repository.");

        const data = await res.json();
        // Decode base64 UTF-8 content safely
        const rawHtml = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));

        // Search for metadata comment block
        const match = rawHtml.match(/<!--\s*SITEBUILDER_DATA:(.*?)\s*-->/s);

        if (match && match[1]) {
          const unescapedJson = match[1].replace(/--&gt;/g, '-->');
          const parsedState = JSON.parse(unescapedJson);
          
          hydrateState(parsedState);
          saveLocal();
          setStatus("Live site loaded successfully!");
        } else {
          // Fallback: If no metadata comment exists, extract raw HTML inside body/site-root
          console.warn("No SITEBUILDER_DATA tag found. Falling back to parsing standard HTML.");
          const parser = new DOMParser();
          const doc = parser.parseFromString(rawHtml, 'text/html');
          const rootNode = doc.getElementById('site-root') || doc.body;
          
          if (rootNode) {
            state.content = rootNode.innerHTML;
            updateUI();
            saveLocal();
            setStatus("Loaded site layout (Legacy / Standard HTML).");
          } else {
            throw new Error("No metadata or valid HTML body found in live index.html.");
          }
        }
      } catch (e) {
        console.error(e);
        setStatus("Load failed: " + e.message);
        alert("Failed to load live site: " + e.message);
      }
    }
  </script>
</body>
</html>
